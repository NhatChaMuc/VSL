project:
  name: ViSign
  version: 0.1

dataset:
  name: Kateht/VOYA_VSL
  # CPU-friendly: chỉ lấy 256 mẫu để chạy thử nhanh
  # Tăng lên 1000-2000 khi có nhiều thời gian hơn
  max_samples: 256

model:
  input_dim: 1605
  sequence_length: 60

  # Model nhỏ hơn để train nhanh trên CPU
  d_model: 128
  num_heads: 4
  num_layers: 2
  ff_dim: 256
  dropout: 0.1

  # num_classes = 0 → tự detect từ dataset (không cần đặt tay)
  num_classes: 0

training:
  epochs: 15
  batch_size: 8
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  num_workers: 0       # 0 = tắt multiprocessing (an toàn trên Windows)

  # Early stopping: dừng nếu val_acc không tăng sau N epochs
  patience: 5

  # LR scheduler: cosine warmup
  min_lr: 1.0e-5
  warmup_epochs: 2

device:
  use_cuda: false    # false vì không có GPU

checkpoint:
  save_dir: checkpoints

output:
  save_dir: outputs